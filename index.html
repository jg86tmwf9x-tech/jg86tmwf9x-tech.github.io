<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMAS Maßnahmen-Datenbank Österreich</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-emerald-700 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-leaf text-emerald-300"></i>
            EMAS Best-Practice Datenbank
          </h1>
          <p class="text-emerald-100 text-sm mt-1">
            Umweltziele & Maßnahmen zertifizierter österreichischer Unternehmen durchsuchen
          </p>
        </div>
        <div class="bg-emerald-800/60 px-4 py-2 rounded-lg text-xs text-emerald-100 border border-emerald-600">
          <i class="fa-solid fa-database mr-1"></i> Client-Side Search (GitHub Pages Ready)
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
      
      <!-- Sidebar Filters -->
      <aside class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit space-y-6">
        <div>
          <h2 class="text-lg font-semibold text-slate-900 border-b border-slate-100 pb-2 mb-4 flex items-center justify-between">
            <span><i class="fa-solid fa-filter text-emerald-600 mr-2"></i>Filter</span>
            <button id="reset-filters" class="text-xs text-emerald-600 hover:underline">Zurücksetzen</button>
          </h2>

          <!-- Search Input -->
          <div class="mb-5">
            <label class="block text-xs font-medium text-slate-600 uppercase mb-2">Freitextsuche</label>
            <div class="relative">
              <input type="text" id="search-input" placeholder="z. B. Photovoltaik, LED, Abfall..." 
                     class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
            </div>
          </div>

          <!-- Filter: Umweltaspekt -->
          <div class="mb-5">
            <label class="block text-xs font-medium text-slate-600 uppercase mb-2">Umweltaspekt</label>
            <select id="filter-aspekt" class="w-full py-2 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="">Alle Umweltaspekte</option>
              <option value="Energie">Energie & Klimaschutz</option>
              <option value="Kreislaufwirtschaft">Kreislaufwirtschaft & Abfall</option>
              <option value="Mobilität">Mobilität & Fuhrpark</option>
              <option value="Wasser">Wasser & Abwasser</option>
              <option value="Beschaffung">Beschaffung & Ressourcen</option>
              <option value="Gefahrstoffe">Gefahrstoffe & Emissionen</option>
            </select>
          </div>

          <!-- Filter: Bundesland -->
          <div class="mb-5">
            <label class="block text-xs font-medium text-slate-600 uppercase mb-2">Bundesland</label>
            <select id="filter-bundesland" class="w-full py-2 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="">Alle Bundesländer</option>
              <option value="Oberösterreich">Oberösterreich</option>
              <option value="Niederösterreich">Niederösterreich</option>
              <option value="Steiermark">Steiermark</option>
              <option value="Wien">Wien</option>
              <option value="Tirol">Tirol</option>
              <option value="Salzburg">Salzburg</option>
              <option value="Kärnten">Kärnten</option>
              <option value="Vorarlberg">Vorarlberg</option>
              <option value="Burgenland">Burgenland</option>
            </select>
          </div>

          <!-- Filter: Unternehmensgröße -->
          <div class="mb-5">
            <label class="block text-xs font-medium text-slate-600 uppercase mb-2">Unternehmensgröße</label>
            <select id="filter-groesse" class="w-full py-2 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="">Alle Größen</option>
              <option value="KMU">KMU (&lt; 250 MA)</option>
              <option value="Großbetrieb">Großbetrieb (&ge; 250 MA)</option>
            </select>
          </div>
        </div>
      </aside>

      <!-- Results Area -->
      <section class="lg:col-span-3 space-y-4">
        <!-- Stats bar -->
        <div class="flex items-center justify-between bg-white px-6 py-4 rounded-xl border border-slate-200 text-sm">
          <div class="text-slate-600">
            Gefunden: <span id="company-count" class="font-bold text-slate-900">0</span> Organisationen mit 
            <span id="measure-count" class="font-bold text-emerald-700">0</span> konkreten Maßnahmen
          </div>
        </div>

        <!-- Dynamic Company Cards -->
        <div id="results-container" class="space-y-6">
          <!-- Dynamisch befüllt via JS -->
        </div>
      </section>

    </div>
  </main>

  <!-- JavaScript -->
  <script>
    let dbData = [];

    // Fallback-Beispieldaten, falls lokal ohne Webserver geöffnet
    const fallbackData = [
      {
        "organisation_id": "AT-000245",
        "name": "HERKA GmbH",
        "standort": { "plz_ort": "3851 Kautzen", "bundesland": "Niederösterreich" },
        "branchenkategorie": { "nace_code": "C 13.2 Weberei", "hauptsektor": "HERSTELLUNG VON WAREN [10 - 33]" },
        "unternehmensgroesse": { "mitarbeiterzahl": 73, "kategorie": "KMU" },
        "webseite": "http://www.herka-frottier.at/",
        "umweltprogramme": [
          {
            "massnahme_id": "AT-000245-01",
            "umweltaspekt": "Energie & Klimaschutz",
            "umweltziel": "Erhöhung des Eigenstromanteils aus erneuerbaren Energien",
            "konkrete_massnahme": "Inbetriebnahme / Leasing einer zweiten PV-Dachanlage (ca. 214 kWp)",
            "quantifizierung_kpi": "197–199 MWh Ertrag/Jahr, Erhöhung der Autarkie um +17%",
            "zieljahr_frist": "2024",
            "status": "In Umsetzung"
          },
          {
            "massnahme_id": "AT-000245-02",
            "umweltaspekt": "Kreislaufwirtschaft & Abfall",
            "umweltziel": "Zero-Waste-Produktion & Textilrecycling",
            "konkrete_massnahme": "Teilnahme am Forschungsprojekt ReSTex (Recycling von Baumwollhandtüchern aus der Industriewäsche)",
            "quantifizierung_kpi": "Schließen des Textilkreislaufs, Vermeidung von Verschnittabfällen",
            "zieljahr_frist": "2029",
            "status": "In Bearbeitung"
          }
        ]
      },
      {
        "organisation_id": "AT-000051",
        "name": "Steyr Automotive GmbH",
        "standort": { "plz_ort": "4400 Steyr", "bundesland": "Oberösterreich" },
        "branchenkategorie": { "nace_code": "C 29.1 Kraftwagen", "hauptsektor": "HERSTELLUNG VON WAREN [10 - 33]" },
        "unternehmensgroesse": { "mitarbeiterzahl": 1000, "kategorie": "Großbetrieb" },
        "webseite": "http://www.steyr-automotive.com/",
        "umweltprogramme": [
          {
            "massnahme_id": "AT-000051-01",
            "umweltaspekt": "Energie & Klimaschutz",
            "umweltziel": "Steigerung der Energieeffizienz (Ziel: CO2-neutral bis 2035)",
            "konkrete_massnahme": "Werksweite Umstellung der Hallen- und Außenbeleuchtung auf LED im Contracting-Modell",
            "quantifizierung_kpi": "6.000 MWh / Jahr Stromeinsparung",
            "zieljahr_frist": "2025",
            "status": "In Umsetzung"
          },
          {
            "massnahme_id": "AT-000051-03",
            "umweltaspekt": "Gefahrstoffe & Emissionen",
            "umweltziel": "Reduzierung von Lösemitteleinsatz und Transportkilometern",
            "konkrete_massnahme": "Errichtung einer eigenen Lösemittel-Aufbereitungsanlage für Spüllösemittel in Halle 35",
            "quantifizierung_kpi": "90–95% Aufbereitungsrate, Einsparung von ca. 175.000 LKW-km / Jahr",
            "zieljahr_frist": "2023",
            "status": "Abgeschlossen"
          }
        ]
      },
      {
        "organisation_id": "AT-000612",
        "name": "Katholische Privat-Universität Linz (KU Linz)",
        "standort": { "plz_ort": "4020 Linz", "bundesland": "Oberösterreich" },
        "branchenkategorie": { "nace_code": "P 85.42 Tertiärer Unterricht", "hauptsektor": "ERZIEHUNG UND UNTERRICHT [85]" },
        "unternehmensgroesse": { "mitarbeiterzahl": 95, "kategorie": "KMU" },
        "webseite": "http://www.ku-linz.at/",
        "umweltprogramme": [
          {
            "massnahme_id": "AT-000612-01",
            "umweltaspekt": "Energie & Klimaschutz",
            "umweltziel": "Stromeinsparung bei der Beleuchtung",
            "konkrete_massnahme": "Umrüstung der Beleuchtungskörper und Hörsaalstrahler im H1 und H2 auf LED",
            "quantifizierung_kpi": "ca. 50% Stromeinsparung für Hörsaalbeleuchtung",
            "zieljahr_frist": "2023",
            "status": "Abgeschlossen"
          },
          {
            "massnahme_id": "AT-000612-03",
            "umweltaspekt": "Mobilität & Fuhrpark",
            "umweltziel": "Verhaltensänderung & nachhaltige Alltagsmobilität",
            "konkrete_massnahme": "Teilnahme an der Aktion 'OÖ radelt' & Initiative Urban Gardening im Bibliothekshof",
            "quantifizierung_kpi": "Reduktion der Anreise-Emissionen, Auszeichnung als aktivster Neueinsteiger",
            "zieljahr_frist": "2025",
            "status": "In Umsetzung"
          }
        ]
      }
    ];

    // Daten laden (JSON oder Fallback)
    async function loadData() {
      try {
        const response = await fetch('emas-database-sample.json');
        if (response.ok) {
          dbData = await response.json();
        } else {
          dbData = fallbackData;
        }
      } catch (e) {
        dbData = fallbackData;
      }
      render();
    }

    // Filter und Rendering Logik
    function render() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const aspektFilter = document.getElementById('filter-aspekt').value;
      const bundeslandFilter = document.getElementById('filter-bundesland').value;
      const groesseFilter = document.getElementById('filter-groesse').value;

      const resultsContainer = document.getElementById('results-container');
      resultsContainer.innerHTML = '';

      let matchingCompanies = 0;
      let matchingMeasuresCount = 0;

      dbData.forEach(org => {
        // Filter Organisation
        const matchBL = !bundeslandFilter || org.standort.bundesland === bundeslandFilter;
        const matchGroesse = !groesseFilter || org.unternehmensgroesse.kategorie === groesseFilter;

        if (!matchBL || !matchGroesse) return;

        // Filter Maßnahmen
        const filteredMeasures = org.umweltprogramme.filter(m => {
          const matchAspekt = !aspektFilter || m.umweltaspekt.toLowerCase().includes(aspektFilter.toLowerCase());
          const matchQuery = !query || 
            org.name.toLowerCase().includes(query) ||
            m.umweltziel.toLowerCase().includes(query) ||
            m.konkrete_massnahme.toLowerCase().includes(query) ||
            m.quantifizierung_kpi.toLowerCase().includes(query);

          return matchAspekt && matchQuery;
        });

        if (filteredMeasures.length > 0) {
          matchingCompanies++;
          matchingMeasuresCount += filteredMeasures.length;

          // Render Card
          const card = document.createElement('div');
          card.className = 'bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden';

          card.innerHTML = `
            <div class="bg-slate-100/80 px-6 py-4 border-b border-slate-200 flex flex-wrap justify-between items-center gap-2">
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="text-lg font-bold text-slate-900">${org.name}</h3>
                  <span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-0.5 rounded-full font-medium">${org.organisation_id}</span>
                </div>
                <p class="text-xs text-slate-500 mt-0.5">
                  <i class="fa-solid fa-location-dot mr-1"></i>${org.standort.plz_ort} (${org.standort.bundesland}) | 
                  <i class="fa-solid fa-industry mr-1 ml-2"></i>${org.branchenkategorie.nace_code}
                </p>
              </div>
              <div class="flex gap-2 text-xs">
                <span class="bg-slate-200 text-slate-700 px-2.5 py-1 rounded-md">${org.unternehmensgroesse.kategorie} (${org.unternehmensgroesse.mitarbeiterzahl} MA)</span>
                ${org.webseite ? `<a href="\${org.webseite}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded-md transition"><i class="fa-solid fa-globe mr-1"></i>Website</a>` : ''}
              </div>
            </div>

            <div class="p-6 divide-y divide-slate-100">
              ${filteredMeasures.map(m => `
                <div class="py-4 first:pt-0 last:pb-0 space-y-2">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <span class="text-xs font-semibold uppercase tracking-wider text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
                      \${m.umweltaspekt}
                    </span>
                    <div class="flex items-center gap-2 text-xs">
                      <span class="text-slate-500"><i class="fa-regular fa-calendar mr-1"></i>Frist: \${m.zieljahr_frist}</span>
                      <span class="px-2 py-0.5 rounded font-medium \${m.status === 'Abgeschlossen' ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800'}">
                        \${m.status}
                      </span>
                    </div>
                  </div>
                  <h4 class="font-semibold text-slate-800 text-sm">Ziel: \${m.umweltziel}</h4>
                  <p class="text-sm text-slate-600">\\({m.konkrete_massnahme}</p>
                  \\){m.quantifizierung_kpi ? `
                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200/80 text-xs text-slate-700 font-mono flex items-center gap-2">
                      <i class="fa-solid fa-chart-line text-emerald-600"></i>
                      <span><strong>KPI / Nutzen:</strong> ${m.quantifizierung_kpi}</span>
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>
          `;
          resultsContainer.appendChild(card);
        }
      });

      document.getElementById('company-count').textContent = matchingCompanies;
      document.getElementById('measure-count').textContent = matchingMeasuresCount;
    }

    // Event Listener
    document.getElementById('search-input').addEventListener('input', render);
    document.getElementById('filter-aspekt').addEventListener('change', render);
    document.getElementById('filter-bundesland').addEventListener('change', render);
    document.getElementById('filter-groesse').addEventListener('change', render);

    document.getElementById('reset-filters').addEventListener('click', () => {
      document.getElementById('search-input').value = '';
      document.getElementById('filter-aspekt').value = '';
      document.getElementById('filter-bundesland').value = '';
      document.getElementById('filter-groesse').value = '';
      render();
    });

    loadData();
  </script>
</body>
</html>
