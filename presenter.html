<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Presenter · This or that?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { overflow: hidden; }
    .app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding: 1.25rem 2rem 1rem; gap: 1rem; }

    .top { display: flex; align-items: baseline; gap: 1.5rem; }
    .top h1 { font-size: clamp(1.4rem, 2.4vw, 2rem); font-weight: 800; }
    .top .counter { color: var(--muted); font-size: 1.1rem; }
    .top .status { margin-left: auto; }

    .stage { display: grid; grid-template-columns: minmax(9rem, 16vw) 1fr minmax(9rem, 16vw); align-items: center; gap: 1.5rem; min-height: 0; }
    .stage .pole .emoji { font-size: clamp(4rem, 9vw, 8rem); }
    .stage .pole-label { font-size: clamp(1.3rem, 2.4vw, 2.2rem); }
    .chart-area { height: 100%; min-height: 0; display: grid; place-items: center; }
    .chart-area svg { width: 100%; height: 100%; max-height: 70vh; overflow: visible; }

    .waiting { text-align: center; }
    .waiting .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(6rem, 16vw, 13rem); line-height: 1;
                    background: linear-gradient(90deg, var(--left), var(--right)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .waiting p { margin: 0.5rem 0 0; color: var(--muted); font-size: 1.3rem; }
    .summary { text-align: center; color: var(--muted); font-size: 1.15rem; margin: 0; }

    .controls { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .controls .spacer { flex: 1; }
    .join { display: flex; align-items: center; gap: 0.75rem; background: none; border: 0; color: inherit; cursor: pointer; padding: 0; font: inherit; text-align: left; }
    .join .qr-small { background: #fff; padding: 6px; border-radius: 8px; line-height: 0; }
    .join span { font-size: 0.95rem; color: var(--muted); max-width: 16rem; }
    .keys { font-size: 0.85rem; color: var(--muted); }

    /* Chart */
    .grid line { stroke: var(--line); stroke-width: 1; }
    .grid text, .bar-count { fill: var(--muted); font: 600 18px var(--font-body); }
    .bar-count { fill: var(--ink); font-size: 22px; font-weight: 700; }
    .curve { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .curve-area { fill: var(--ink); opacity: 0.06; }
    .mean line { stroke: var(--ink); stroke-width: 2.5; stroke-dasharray: 7 7; }
    .mean text { fill: var(--ink); font: 700 18px var(--font-body); }
    .animate .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 0.7s cubic-bezier(.2,.8,.2,1) both; }
    .animate .bar-count { animation: fade 0.4s 0.8s both; }
    .animate .curve { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s 0.6s ease-out forwards; }
    .animate .curve-area, .animate .mean { animation: fade 0.5s 1.4s both; }
    @keyframes grow { from { transform: scaleY(0); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { from { opacity: 0; } }

    /* Gate + dialog */
    .gate { position: fixed; inset: 0; background: var(--paper); display: grid; place-items: center; padding: 1.5rem; z-index: 10; }
    .gate-box { width: 100%; max-width: 28rem; }
    .gate-box h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.75rem; }
    .gate-box p { color: var(--muted); margin: 0 0 1.25rem; }
    .gate-box label { display: block; font-weight: 700; margin-bottom: 0.4rem; }
    .gate-box input { width: 100%; font: 1rem var(--font-body); padding: 0.8rem 1rem; border-radius: 12px; border: 2px solid var(--line);
                      background: var(--surface); color: var(--ink); margin-bottom: 1rem; }
    dialog { border: 0; border-radius: 24px; padding: 2.5rem; background: var(--surface); color: var(--ink); text-align: center; }
    dialog::backdrop { background: rgba(10, 14, 30, 0.7); }
    dialog h2 { font-size: 2.2rem; font-weight: 800; margin-bottom: 1.25rem; }
    .qr-big { background: #fff; padding: 16px; border-radius: 16px; display: inline-block; line-height: 0; }
    .join-url { font-size: 1.2rem; margin: 1.25rem 0; word-break: break-all; }
  </style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <h1>Presenter</h1>
    <p id="gate-text">Enter the admin secret of your Nhost project. It stays in this browser tab only and is never saved.</p>
    <label for="secret">Admin secret</label>
    <input id="secret" type="password" autocomplete="off">
    <button class="btn" id="unlock">Open presenter view</button>
    <p class="error-text" id="gate-error" role="alert"></p>
  </div>
</div>

<div class="app">
  <header class="top">
    <h1 id="title">This or that?</h1>
    <span class="counter" id="counter"></span>
    <span class="status" id="status" data-state="connecting">Connecting</span>
  </header>

  <section class="stage">
    <div class="pole pole-left" id="left"></div>
    <div class="chart-area" id="chart-area"></div>
    <div class="pole pole-right" id="right"></div>
  </section>

  <footer class="controls">
    <button class="join" id="join-btn" title="Show join code (Q)">
      <div class="qr-small" id="qr-small"></div>
      <span>Scan to join<br><span id="join-short"></span></span>
    </button>
    <div class="spacer"></div>
    <span class="keys">Clicker or arrow keys: reveal, then next</span>
    <button class="btn ghost" id="prev">Previous</button>
    <button class="btn ghost" id="reveal">Show results</button>
    <button class="btn" id="next">Next pair</button>
    <button class="btn ghost" id="csv">Download CSV</button>
    <button class="btn ghost" id="new-round">New round</button>
  </footer>
</div>

<dialog id="join-dialog">
  <h2>Join on your phone</h2>
  <div class="qr-big" id="qr-big"></div>
  <p class="join-url" id="join-url"></p>
  <button class="btn" id="close-join">Close</button>
</dialog>

<script src="config.js"></script>
<script src="nhost.js"></script>
<script>
(function () {
  const cfg = window.APP_CONFIG;
  const $ = (s) => document.querySelector(s);
  document.title = "Presenter · " + cfg.title;
  $("#title").textContent = cfg.title;

  let secret = null, state = null, values = [], stopVotes = null, lastRevealKey = null;
  const hdr = () => ({ "x-hasura-admin-secret": secret });

  // ── Join link + QR ──────────────────────────────────────────
  const joinUrl = new URL("index.html", location.href).href;
  $("#join-url").textContent = joinUrl;
  $("#join-short").textContent = joinUrl.replace(/^https?:\/\//, "").replace(/index\.html$/, "");
  if (window.QRCode) {
    new QRCode($("#qr-small"), { text: joinUrl, width: 84, height: 84 });
    new QRCode($("#qr-big"), { text: joinUrl, width: 340, height: 340 });
  } else {
    $("#qr-small").hidden = true; $("#qr-big").hidden = true;
  }
  const dlg = $("#join-dialog");
  $("#join-btn").onclick = () => dlg.showModal();
  $("#close-join").onclick = () => dlg.close();

  // ── GraphQL ─────────────────────────────────────────────────
  const STATE_SUB = `subscription { session_state_by_pk(id: 1) { run_id question_index revealed } }`;
  const VOTES_SUB = `subscription Votes($run: uuid!, $q: Int!) {
    votes(where: { run_id: { _eq: $run }, question_index: { _eq: $q } }) { value }
  }`;
  const SET_STATE = `mutation Set($q: Int!, $rev: Boolean!) {
    update_session_state_by_pk(pk_columns: { id: 1 }, _set: { question_index: $q, revealed: $rev }) { id }
  }`;
  const NEW_ROUND = `mutation Round($run: uuid!) {
    update_session_state_by_pk(pk_columns: { id: 1 }, _set: { run_id: $run, question_index: 0, revealed: false }) { id }
  }`;
  const ALL_VOTES = `query All($run: uuid!) {
    votes(where: { run_id: { _eq: $run } }, order_by: [{ question_index: asc }, { created_at: asc }]) { question_index value created_at }
  }`;

  // ── Gate ────────────────────────────────────────────────────
  if (!Nhost.isConfigured()) {
    $("#gate-text").textContent = "Add your Nhost GraphQL URL to config.js first, then reload this page.";
    $("#secret").disabled = true; $("#unlock").disabled = true;
  }
  async function unlock() {
    secret = $("#secret").value.trim();
    $("#gate-error").textContent = "";
    if (!secret) return;
    try {
      const d = await Nhost.gql(`query { session_state_by_pk(id: 1) { run_id } }`, {}, hdr());
      if (!d.session_state_by_pk) throw new Error("The session table is empty. Run setup.sql in the Nhost SQL editor.");
      $("#secret").value = "";
      $("#gate").hidden = true;
      start();
    } catch (e) {
      $("#gate-error").textContent = /secret|access|denied|JWT|not found in type/i.test(e.message)
        ? "That secret was not accepted, or the tables are not tracked yet. Check both in the Nhost dashboard."
        : e.message;
    }
  }
  $("#unlock").onclick = unlock;
  $("#secret").addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });

  // ── Live state ──────────────────────────────────────────────
  function start() {
    const status = $("#status");
    const labels = { live: "Live", polling: "Live (polling)", reconnecting: "Reconnecting", error: "Connection problem" };
    Nhost.live(STATE_SUB, {}, hdr(), onState, (st) => { status.dataset.state = st; status.textContent = labels[st] || st; });
  }

  function onState(data) {
    const s = data && data.session_state_by_pk;
    if (!s) return;
    const changed = !state || s.run_id !== state.run_id || s.question_index !== state.question_index;
    state = s;
    if (changed) {
      values = [];
      if (stopVotes) stopVotes();
      stopVotes = Nhost.live(VOTES_SUB, { run: s.run_id, q: s.question_index }, hdr(), (d) => {
        values = (d.votes || []).map((v) => v.value);
        render();
      });
      const pair = cfg.pairs[s.question_index];
      renderPole($("#left"), pair && pair.left);
      renderPole($("#right"), pair && pair.right);
    }
    render();
  }

  function renderPole(el, pole) {
    el.replaceChildren();
    if (!pole) return;
    if (pole.image) {
      const img = document.createElement("img"); img.src = pole.image; img.alt = "";
      el.append(img);
    } else if (pole.emoji) {
      const s = document.createElement("span"); s.className = "emoji"; s.textContent = pole.emoji;
      s.setAttribute("aria-hidden", "true"); el.append(s);
    }
    const l = document.createElement("span"); l.className = "pole-label"; l.textContent = pole.label;
    el.append(l);
  }

  function render() {
    if (!state) return;
    const total = cfg.pairs.length, q = state.question_index, pair = cfg.pairs[q];
    $("#counter").textContent = pair ? `Pair ${q + 1} of ${total}` : "Finished";
    $("#prev").disabled = q <= 0;
    $("#next").disabled = q >= total - 1;
    $("#reveal").textContent = state.revealed ? "Hide results" : "Show results";
    const area = $("#chart-area");

    if (!pair) { area.innerHTML = `<div class="waiting"><p>No more pairs. Start a new round or add pairs in config.js.</p></div>`; return; }

    if (!state.revealed) {
      area.innerHTML = `<div class="waiting"><div class="big">${values.length}</div>
        <p>${values.length === 1 ? "answer" : "answers"} so far</p></div>`;
      return;
    }
    const key = state.run_id + ":" + q;
    const animate = key !== lastRevealKey;
    lastRevealKey = key;
    area.innerHTML = chartSvg(values, pair, animate);
  }

  // ── Statistics ──────────────────────────────────────────────
  const mean = (a) => a.reduce((s, v) => s + v, 0) / a.length;
  function quantile(sorted, p) {
    const i = (sorted.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
  }
  // Gaussian kernel density estimate, Silverman's rule-of-thumb bandwidth.
  // Reflection at 0 and 100 keeps the curve from leaking past the slider ends.
  function kde(vals, xs) {
    const n = vals.length, m = mean(vals);
    const sd = Math.sqrt(vals.reduce((s, v) => s + (v - m) ** 2, 0) / Math.max(1, n - 1));
    const sorted = [...vals].sort((a, b) => a - b);
    const iqr = quantile(sorted, 0.75) - quantile(sorted, 0.25);
    const spread = iqr > 0 ? Math.min(sd, iqr / 1.34) : sd;
    let h = 0.9 * spread * Math.pow(n, -0.2);
    if (!(h > 0)) h = 5;
    h = Math.max(h, 3);
    const k = (u) => Math.exp(-0.5 * u * u);
    const norm = n * h * Math.sqrt(2 * Math.PI);
    return xs.map((x) => vals.reduce((s, v) => s + k((x - v) / h) + k((x + v) / h) + k((x - (200 - v)) / h), 0) / norm);
  }

  // ── Chart (SVG) ─────────────────────────────────────────────
  function chartSvg(vals, pair, animate) {
    const W = 1000, H = 560, m = { l: 50, r: 20, t: 40, b: 70 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const n = vals.length;
    if (!n) return `<div class="waiting"><p>No answers for this pair yet.</p></div>`;

    const B = cfg.bins || 10, bw = 100 / B;
    const counts = new Array(B).fill(0);
    vals.forEach((v) => { counts[Math.min(B - 1, Math.max(0, Math.floor(v / bw)))]++; });

    let curve = null;
    if (n >= 3) {
      const xs = Array.from({ length: 201 }, (_, i) => i / 2);
      const d = kde(vals, xs);
      curve = xs.map((x, i) => [x, d[i] * n * bw]); // scale density to bar heights
    }
    const peak = Math.max(...counts, ...(curve ? curve.map((p) => p[1]) : [0]));
    const yMax = Math.max(4, Math.ceil(peak * 1.15));
    const step = Math.max(1, Math.ceil(yMax / 5));
    const X = (v) => m.l + (v / 100) * iw;
    const Y = (c) => m.t + ih - (c / yMax) * ih;

    let out = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Histogram of ${n} answers" class="${animate ? "animate" : ""}">`;
    out += `<defs><linearGradient id="spec" x1="0" x2="1"><stop offset="0" stop-color="var(--left)"/><stop offset="0.5" stop-color="var(--line)"/><stop offset="1" stop-color="var(--right)"/></linearGradient></defs>`;

    out += `<g class="grid">`;
    for (let c = step; c <= yMax; c += step) {
      out += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(c)}" y2="${Y(c)}"/><text x="${m.l - 12}" y="${Y(c) + 6}" text-anchor="end">${c}</text>`;
    }
    out += `</g>`;

    const gap = 6;
    counts.forEach((c, i) => {
      if (!c) return;
      const x = X(i * bw) + gap / 2, w = (iw / B) - gap, y = Y(c), h = m.t + ih - y;
      // Colour by side: pale near the middle, full pole colour at the ends.
      const centre = (i + 0.5) * bw, pole = centre < 50 ? "var(--left)" : "var(--right)";
      const strength = Math.round(35 + 65 * Math.abs(centre - 50) / 50);
      out += `<rect class="bar" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"
        style="fill: color-mix(in oklab, ${pole} ${strength}%, var(--line)); animation-delay:${(i * 0.05).toFixed(2)}s"/>`;
      out += `<text class="bar-count" x="${x + w / 2}" y="${y - 10}" text-anchor="middle">${c}</text>`;
    });

    if (curve) {
      const pts = curve.map(([x, c]) => `${X(x).toFixed(1)},${Y(c).toFixed(1)}`);
      out += `<path class="curve-area" d="M${X(0)},${Y(0)} L${pts.join(" L")} L${X(100)},${Y(0)} Z"/>`;
      out += `<path class="curve" pathLength="1" d="M${pts.join(" L")}"/>`;
    }

    const avg = mean(vals);
    out += `<g class="mean"><line x1="${X(avg)}" x2="${X(avg)}" y1="${m.t - 10}" y2="${m.t + ih}"/>
      <text x="${X(avg)}" y="${m.t - 18}" text-anchor="middle">Average</text></g>`;

    out += `<rect x="${m.l}" y="${m.t + ih + 14}" width="${iw}" height="14" rx="7" fill="url(#spec)"/>`;
    out += `</svg>`;

    const pct = Math.round(Math.abs(avg - 50) * 2);
    const lean = Math.abs(avg - 50) < 2 ? "The room is split right down the middle."
      : `On average the room leans ${pct}% towards ${avg < 50 ? pair.left.label : pair.right.label}.`;
    return `<div style="width:100%;height:100%;display:grid;grid-template-rows:1fr auto;gap:.5rem">${out}
      <p class="summary">${n} ${n === 1 ? "answer" : "answers"}. ${escapeHtml(lean)}</p></div>`;
  }
  function escapeHtml(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  // ── Controls ────────────────────────────────────────────────
  async function setState(q, revealed) {
    try { await Nhost.gql(SET_STATE, { q, rev: revealed }, hdr()); }
    catch (e) { alert("Could not update: " + e.message); }
  }
  const next = () => state && state.question_index < cfg.pairs.length - 1 && setState(state.question_index + 1, false);
  const prev = () => state && state.question_index > 0 && setState(state.question_index - 1, false);
  const toggleReveal = () => state && setState(state.question_index, !state.revealed);

  $("#next").onclick = next;
  $("#prev").onclick = prev;
  $("#reveal").onclick = toggleReveal;

  $("#new-round").onclick = async () => {
    if (!confirm("Start a new round? Everyone starts again at pair 1. Earlier answers stay in the database.")) return;
    try { await Nhost.gql(NEW_ROUND, { run: Nhost.uuid() }, hdr()); }
    catch (e) { alert("Could not start a new round: " + e.message); }
  };

  $("#csv").onclick = async () => {
    if (!state) return;
    try {
      const d = await Nhost.gql(ALL_VOTES, { run: state.run_id }, hdr());
      const q = (s) => `"${String(s).replace(/"/g, '""')}"`;
      const rows = [["pair", "left", "right", "value_0_to_100", "time"].join(",")];
      d.votes.forEach((v) => {
        const p = cfg.pairs[v.question_index] || { left: { label: "" }, right: { label: "" } };
        rows.push([v.question_index + 1, q(p.left.label), q(p.right.label), v.value, v.created_at].join(","));
      });
      const blob = new Blob([rows.join("\n")], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `icebreaker-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } catch (e) { alert("Could not export: " + e.message); }
  };

  // Clicker-friendly: forward = reveal, then next pair. Back = hide, then previous pair.
  document.addEventListener("keydown", (e) => {
    if (!$("#gate").hidden || e.target.tagName === "INPUT") return;
    if (e.key === " " && e.target.tagName === "BUTTON") return; // let the focused button handle it
    if (["ArrowRight", "PageDown", " "].includes(e.key)) {
      e.preventDefault();
      if (state && !state.revealed) toggleReveal(); else next();
    } else if (["ArrowLeft", "PageUp"].includes(e.key)) {
      e.preventDefault();
      if (state && state.revealed) toggleReveal(); else prev();
    } else if (e.key.toLowerCase() === "q") {
      dlg.open ? dlg.close() : dlg.showModal();
    }
  });
})();
</script>
</body>
</html>
